<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Enrollment up 12%, cost per member flat</title>
<style>
    body {
      background: #FFFFFF;
      color: #1A1A1A;
      font-family: "Helvetica Neue", sans-serif;
      max-width: 960px;
      margin: 0 auto;
      padding: 32px;
    }
    .title-block { margin-bottom: 32px; }
    .eyebrow {
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 0.05em;
    }
    h1 { font-size: 32px; margin: 8px 0; }
    .stat-trio {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    .stat { text-decoration: none; color: inherit; display: block; }
    .stat-value {
      font-size: 28px;
      font-weight: bold;
      color: #1F3A5F;
    }
    .stat-label {
      font-size: 12px;
      color: #4A4A4A;
    }
    .stat-delta { font-size: 12px; }
    @media (max-width: 600px) {
      .stat-trio { grid-template-columns: 1fr; }
    }
    </style>
</head>
<body>

    <section class="title-block">
      <div class="eyebrow" style="color:#1F3A5F">Q3 2026</div>
      <h1>Enrollment up 12%, cost per member flat</h1>
    </section>
    <section class="stat-trio"><div class="stat">
          <div class="stat-value">142,300</div>
          <div class="stat-label">Members enrolled</div>
          <div class="stat-delta" style="color:#C97A2B">+12%</div>
        </div><div class="stat">
          <div class="stat-value">$412</div>
          <div class="stat-label">Cost per member</div>
          <div class="stat-delta" style="color:#C97A2B">0%</div>
        </div><div class="stat">
          <div class="stat-value">94.2%</div>
          <div class="stat-label">Retention</div>
          <div class="stat-delta" style="color:#C97A2B">+1.4pt</div>
        </div></section>
</body>
</html>
