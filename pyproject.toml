[project]
name = "bindery"
version = "0.1.0"
description = "Local-first design artifact studio"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.23",
    "pyyaml>=6.0",
    "python-pptx>=1.0",
    "pillow>=10.1",
    "cairosvg>=2.7",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-multipart>=0.0.12",
]

[project.scripts]
bindery = "bindery.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bindery*"]
