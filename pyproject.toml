[project]
name = "bindery"
version = "0.1.0"
description = "Local-first design artifact studio"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.23",
    "pyyaml>=6.0",
    "python-pptx>=1.0",
    "pillow>=10.1",
]

[project.scripts]
bindery = "bindery.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bindery*"]
